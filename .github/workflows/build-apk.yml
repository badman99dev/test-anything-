name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to tempserv
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK found: $APK_PATH"
          RESP=$(curl -s -X POST https://tempserv.cmdnode.xyz/api/upload \
            -F "mode=file" \
            -F "expiry=24hr" \
            -F "paths=[\"$(basename $APK_PATH)\"]" \
            -F "files=@$APK_PATH")
          echo "Upload response: $RESP"
          URL=$(echo $RESP | python3 -c "import sys,json; print(json.load(sys.stdin).get('url',''))")
          echo "===APK_LINK=== $URL"
